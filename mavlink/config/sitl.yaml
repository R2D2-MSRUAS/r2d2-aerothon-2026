# Safe development profile: UDP receive endpoint only.
# Start ArduPilot SITL/MAVProxy with an output directed to UDP port 14550.
connection:
  transport: udp
  endpoint: udpin:0.0.0.0:14550
  source_system_id: 245
  source_component_id: 190
  expected_system_id: null
  expected_component_id: null
telemetry:
  heartbeat_stale_s: 3.0
