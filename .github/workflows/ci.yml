name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CI tools
        run: python -m pip install --upgrade pip ruff pytest

      - name: Python syntax
        run: python -m compileall -q .

      - name: Ruff static checks
        run: ruff check .

      - name: Pure logic tests
        run: pytest -q --pass-with-no-tests tests
